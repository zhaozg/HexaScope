<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HexaScope App 注册回调</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #2ea44f;
      --danger: #f85149;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      line-height: 1.6;
      padding: 48px 16px;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin: 0 0 12px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-top: 20px;
    }
    .warn {
      border-left: 3px solid var(--danger);
      padding: 8px 12px;
      background: rgba(248, 81, 73, 0.08);
      color: var(--muted);
    }
    pre {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      overflow-x: auto;
      font-size: 0.85em;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .muted { color: var(--muted); }
    a { color: #58a6ff; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>GitHub App 注册结果</h1>
    <div class="card" id="result">
      <p class="muted">正在获取 App 凭据…</p>
    </div>
  </main>

  <script>
    // GitHub App Manifest 回调：用一次性 code 换取 App 凭据
    // 参考：https://docs.github.com/en/apps/sharing-apps-and-migrations/creating-a-github-app-manifest
    ;(async () => {
      const card = document.getElementById('result')
      const params = new URLSearchParams(location.search)
      const code = params.get('code')

      if (!code) {
        card.innerHTML = `
          <p class="warn">未收到授权码。可能未完成注册，或回调链接被手动打开。</p>
          <p class="muted">请返回 <a href="./app-manifest.html">注册页</a> 重新操作。</p>`
        return
      }

      try {
        const res = await fetch(`https://api.github.com/app-manifests/${code}/conversions`, {
          method: 'POST',
          headers: { Accept: 'application/vnd.github+json' }
        })
        if (!res.ok) throw new Error(`HTTP ${res.status}`)
        const app = await res.json()

        card.innerHTML = `
          <h2>✅ App 已创建（slug: <code>${app.slug}</code>）</h2>
          <p class="warn">凭据仅显示这一次，请立即保存！Client Secret 与 Private Key 不会再次展示。</p>
          <h3>Client ID</h3><pre>${app.client_id}</pre>
          <h3>Client Secret</h3><pre>${app.client_secret}</pre>
          <h3>Private Key（PEM）</h3><pre>${app.pem}</pre>
          <h3>Webhook Secret</h3><pre>${app.webhook_secret || '（未启用 webhook）'}</pre>
          <h3>下一步</h3>
          <ol class="muted">
            <li>访问 <a href="https://github.com/apps/${app.slug}" target="_blank" rel="noopener">github.com/apps/${app.slug}</a> 安装 App 到你的账户；</li>
            <li>安装后自动触发评估，访问 <code>?user=你的用户名</code> 查看雷达图；</li>
            <li>如需启用 Copilot 扩展等高级能力，再把 Client ID / Secret / Private Key 配置到仓库 Secrets。</li>
          </ol>`
      } catch (err) {
        card.innerHTML = `
          <h2>❌ 获取凭据失败</h2>
          <p class="warn">${err.message}</p>
          <p class="muted">请到 <a href="https://github.com/settings/apps" target="_blank" rel="noopener">Settings → Developer settings → GitHub Apps</a> 确认 App 是否已创建，手动复制凭据。</p>`
      }
    })()
  </script>
</body>
</html>
