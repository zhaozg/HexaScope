# 部署适配：scripts/frontend-build-cli.ts 在 `nue build` 后把资源引用改写为
# 相对路径，使站点可运行于 https://zhaozg.github.io/HexaScope/ 子路径。
      - 'scripts/frontend-build-cli.ts'
# 前端仪表板（Nuekit 2.0 SPA）构建后部署到 GitHub Pages 项目站点子路径。
#
# 触发：main 分支上影响前端产物、构建脚本或依赖的变更；可手动触发。
# 前置条件：仓库 Settings → Pages → Build and deployment → Source 选择
# "GitHub Actions"（本工作流由 actions/deploy-pages 执行部署）。
#
# 部署适配：scripts/frontend-build.ts 在 `nue build` 后把资源引用改写为
# 相对路径，使站点可运行于 https://zhaozg.github.io/HexaScope/ 子路径。

"on":
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'scripts/frontend-build.ts'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: 构建并部署 Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1

      - name: 缓存 Bun 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
      - name: 配置 Pages（未启用时自动启用，保证部署可自愈）
        uses: actions/configure-pages@v5
        with:
          enablement: true
            ${{ runner.os }}-bun-

      - name: 安装依赖（锁定版本，保证可复现）
        run: bun install --frozen-lockfile

      - name: 构建前端静态站点（相对路径改写，适配 Pages 子路径）
        run: bun run frontend:build

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/.dist

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
